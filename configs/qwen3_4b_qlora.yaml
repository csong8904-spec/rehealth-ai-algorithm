model:
  name_or_path: Qwen/Qwen3-4B
  revision: REVIEW_AND_PIN_BEFORE_TRAINING
  trust_remote_code: false
  load_in_4bit: true

training:
  method: qlora_sft
  dataset: data/sft/rehealth_sft.reviewed.jsonl
  output_dir: artifacts/report_generator
  max_sequence_length: 1024
  epochs: 3
  learning_rate: 0.0002
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8
  warmup_ratio: 0.05
  seed: 20261007

lora:
  rank: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj

release_gates:
  require_human_reviewed_dataset: true
  require_license_snapshot: true
  require_model_hash: true
  require_safety_evaluation: true
  require_fact_consistency_evaluation: true
