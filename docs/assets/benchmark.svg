<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title">
  <title id="title">Mean absolute error by candidate model</title><rect width="1000" height="500" rx="24" fill="#f6f9fc"/>
  <style>.h{font:700 25px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#102a43}.t{font:15px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#334e68}.v{font:700 16px 'Segoe UI',sans-serif;fill:#102a43}.grid{stroke:#d9e2ec;stroke-width:1}</style>
  <text x="50" y="48" class="h">候选模型平均绝对误差 / MAE (bpm)</text>
