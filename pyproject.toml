[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "healthsynth"
version = "0.1.0"
description = "Safety-first health trend report synthesis research toolkit"
readme = "README_EN.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.urls]
Homepage = "https://github.com/csong8904-spec/rehealth-ai-algorithm"
Repository = "https://github.com/csong8904-spec/rehealth-ai-algorithm"
Issues = "https://github.com/csong8904-spec/rehealth-ai-algorithm/issues"

[project.optional-dependencies]
dev = ["pillow>=10.0"]
llm = [
  "torch>=2.5",
  "transformers>=4.51",
  "accelerate>=1.0",
  "peft>=0.14",
  "datasets>=3.0",
]

[project.scripts]
rehealth-ai = "healthsynth.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
